# Galería de átomos e instrumentos (F19 / F27) y shell (F26).
- id: gal-atoms
  screen: galeria
  ref: { hash: '#galeria' }
  cand: { path: /__galeria }
  planet: none
  gateFromPhase: 19
- id: gal-sheet
  screen: galeria
  ref: { hash: '#galeria' }
  cand: { path: /__galeria }
  planet: none
  actions:
    - click: { role: button, name: Abrir hoja }
      expect: { role: dialog }
  frames: 1
  gateFromPhase: 19
- id: gal-instruments
  screen: galeria
  ref: { hash: '#galeria?parte=instrumentos' }
  cand: { path: /__galeria, search: '?parte=instrumentos' }
  planet: none
  gateFromPhase: 27
- id: '404'
  screen: shell
  planetFromPhase: 27  # el planeta estacionado llega en F27 (D-70)
  ref: { hash: '#no-existe' }
  cand: { path: /no-existe }
  gateFromPhase: 26
- id: state-loading
  screen: shell
  planetFromPhase: 27  # el planeta estacionado llega en F27 (D-70)
  ref: { hash: '#inicio', search: '?demo=loading' }
  cand: { path: /, search: '?demo=loading' }
  gateFromPhase: 26
- id: state-error
  screen: shell
  planetFromPhase: 27  # el planeta estacionado llega en F27 (D-70)
  ref: { hash: '#inicio', search: '?demo=error' }
  cand: { path: /, search: '?demo=error' }
  gateFromPhase: 26

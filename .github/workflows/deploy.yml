name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, staging]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tm_user
          POSTGRES_PASSWORD: tm_pass
          POSTGRES_DB: tm_scorekeeper_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q
        env:
          DATABASE_URL: postgresql://tm_user:tm_pass@localhost:5432/tm_scorekeeper_test

  test-migrations:
    # Las migraciones sobre una base vacía: upgrade completo, downgrade a base y upgrade otra vez.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tm_user
          POSTGRES_PASSWORD: tm_pass
          POSTGRES_DB: tm_migrations_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://tm_user:tm_pass@localhost:5432/tm_migrations_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: alembic upgrade head && alembic downgrade base && alembic upgrade head
        working-directory: backend

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Presupuesto del bundle (JS inicial y planeta aparte)
        run: node tools/budgets/check-bundle.mjs

  test-tools:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fixtures del mockup al día
        run: node tools/fixtures/export.mjs --check
      - name: Semántica del mockup (casos borde)
        run: node --test tools/fixtures/*.test.mjs
      - name: Presupuestos (lógica)
        run: node --test tools/budgets/*.test.mjs
      - run: npm ci
        working-directory: tools/parity
      - name: Tests del arnés de comparación
        run: npm test
        working-directory: tools/parity

  migrate-and-deploy:
    needs: [test-backend, test-migrations, test-frontend, test-tools]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - name: Run migrations
        run: alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Trigger Render deploy
        run: curl -fsSX POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
